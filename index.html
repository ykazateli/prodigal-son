<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Возвращение блудного сына | Указатели</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }

        .puzzle-wrapper {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            max-height: 900px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            background: #2a2a2a;
        }

        .puzzle-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        .puzzle-frame {
            position: absolute;
            top: -40px;
            left: 0;
            width: 100%;
            height: calc(100% + 40px);
            border: none;
            display: block;
        }

        /* Ссылка на «Указатели» — по центру сверху */
        .brand-link {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: background 0.25s, color 0.25s, transform 0.2s;
            white-space: nowrap;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .brand-link:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            transform: translateX(-50%) scale(1.05);
        }

        @media (max-width: 600px) {
            body { padding: 6px; }
            .puzzle-wrapper { height: 92vh; max-height: none; border-radius: 8px; }
            .brand-link {
                top: 10px;
                font-size: 0.75rem;
                padding: 4px 14px;
            }
            .puzzle-frame {
                top: -35px;
                height: calc(100% + 35px);
            }
        }
    </style>
</head>
<body>

    <div class="puzzle-wrapper">
        <div class="puzzle-container">
            <iframe
                src="https://www.jigsawplanet.com/?rc=play&amp;pid=01732fcbd954&amp;view=iframe"
                class="puzzle-frame"
                allowfullscreen>
            </iframe>
        </div>

        <!-- Ссылка на «Указатели» по центру -->
        <a href="https://vk.com/ykazateli_of_christ" target="_blank" class="brand-link">
            🕯️ Указатели
        </a>
    </div>

</body>
</html>
